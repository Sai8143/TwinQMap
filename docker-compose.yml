version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: twinq_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - twinq_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: twinq_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/twinq_map
      - OPERATION_MODE=SIMULATED
    volumes:
      - backend_logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - twinq_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: twinq_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - twinq_network

volumes:
  mongodb_data:
  backend_logs:

networks:
  twinq_network:
    driver: bridge
